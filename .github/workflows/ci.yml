name: Next.js checks
on:
  push:
    branches: [main, feature/staging-ready]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-placeholder-not-used-for-real-accounts
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npm run test:access
      - run: npm run test:hosted
      - run: npm run test:backup
